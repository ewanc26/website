name: Update GitHub languages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch language breakdown
        run: node --experimental-strip-types scripts/update-github-languages.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          OUT_FILE: ${{ runner.temp }}/github-languages.json

      # main is protected, so the snapshot lives on an unprotected `data` branch
      # that the site reads from raw.githubusercontent.com.
      - name: Publish to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data:data
            git worktree add "$RUNNER_TEMP/data" data
          else
            git worktree add --orphan -b data "$RUNNER_TEMP/data"
          fi
          cd "$RUNNER_TEMP/data"
          cp "$RUNNER_TEMP/github-languages.json" github-languages.json
          git add github-languages.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh GitHub language breakdown"
          git push origin data

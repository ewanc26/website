name: Refresh OAuth lockfile

on:
  push:
    branches: [feat/leaflet-reader-compat]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: oauth-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error

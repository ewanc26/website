name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_ATPROTO_DID: did:plc:aaaaaaaaaaaaaaaaaaaaaaaa
      PUBLIC_LEAFLET_BLOG_PUBLICATION: 3aaaaaaaaaaaa
      PUBLIC_SITE_TITLE: CI
      PUBLIC_SITE_DESCRIPTION: CI validation build
      GITHUB_USERNAME: octocat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Run focused tests
        run: |
          pnpm test:site-info
          pnpm test:blog

      - name: Build
        run: pnpm build

  audit:
    name: Links and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    env:
      PUBLIC_ATPROTO_DID: did:plc:aaaaaaaaaaaaaaaaaaaaaaaa
      PUBLIC_LEAFLET_BLOG_PUBLICATION: 3aaaaaaaaaaaa
      PUBLIC_SITE_TITLE: CI
      PUBLIC_SITE_DESCRIPTION: CI validation build
      GITHUB_USERNAME: octocat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Crawl links and run axe
        run: |
          pnpm dev --port 4321 &
          npx --yes wait-on http://localhost:4321/support --timeout 60000
          pnpm audit:site http://localhost:4321
